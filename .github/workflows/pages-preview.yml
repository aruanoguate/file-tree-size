name: Deploy Preview Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Preview Site
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run core tests
        run: npm --prefix packages/tree-size-core run test -- --ci

      - name: Run JSON tests
        run: npm --prefix packages/json-tree-size run test -- --ci

      - name: Run XML tests
        run: npm --prefix packages/xml-tree-size run test -- --ci

      - name: Run preview tests
        run: npm --prefix packages/tree-size-preview run test -- --ci

      - name: Build preview site
        run: npm --prefix packages/tree-size-preview run compile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/tree-size-preview/dist

  deploy:
    name: Deploy Preview Site
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4